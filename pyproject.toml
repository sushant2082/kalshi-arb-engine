[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kalshi-arb-engine"
version = "0.1.0"
description = "LP-based static-arbitrage detection engine for Kalshi bracket and ladder markets (read-only, paper-trading only)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.20",
    "numpy>=1.26",
    "scipy>=1.13",
    "cryptography>=42",
    "certifi>=2024.2",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
arbengine = "arbengine.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/arbengine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
